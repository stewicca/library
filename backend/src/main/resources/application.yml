spring:
  application:
    name: library-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

library:
  jwt:
    # MUST be overridden in every environment. A long random string (>= 32 bytes for HS256).
    secret: ${JWT_SECRET:change-me-in-env-this-default-is-not-secure-0123456789}
    issuer: ${JWT_ISSUER:library-api}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-expiration-hours: ${JWT_REFRESH_TOKEN_HOURS:168}
  cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    enabled: ${ADMIN_SEED_ENABLED:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
